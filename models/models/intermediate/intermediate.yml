version: 2

models:
  - name: int_orders
    description: "Intermediate table with enriched order data"
    columns:
      - name: od_id
        tests:
          - unique
          - not_null
      - name: cust_id
        tests:
          - not_null
      - name: order_status
      - name: customer_full_name
  - name: int_order_revenue
    description: "Intermediate table for order revenue calculations"
    columns:
      - name: od_id
        tests:
          - not_null
      - name: total_revenue
        tests:
          - not_null
